name: Deploy LADNIK Control Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate public production configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Set repository variable SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Set repository variable SUPABASE_PUBLISHABLE_KEY}"
          test "$SUPABASE_URL" = "https://qnzagdheekhxevpqbfzj.supabase.co"
          [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]

      - name: Install dependencies
        working-directory: admin_web
        run: flutter pub get

      - name: Analyze
        working-directory: admin_web
        run: flutter analyze

      - name: Tests
        working-directory: admin_web
        run: flutter test

      - name: Build production web
        working-directory: admin_web
        run: >
          flutter build web --release --base-href /
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=LADNIK_CONTROL_ENVIRONMENT=production

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin_web/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
