# Template for .github/workflows/deploy-pages.yml in the PUBLIC repo
# ladnik-admin/ladnik-admin.github.io (#392). Kept here so the private repo
# stays the only source. It deploys the already built site/ folder; it never
# builds source and holds no secret. Installing it is a one-time owner step
# (docs/ADMIN_PAGES_PUBLISH.md), because a contents-only deploy token cannot
# change workflow files.
name: Deploy LADNIK Control Center

on:
  push:
    branches: [main]
    # The switch commit changes only this file: it must deploy too.
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require a built site
        run: test -f site/index.html && test -f site/source.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
